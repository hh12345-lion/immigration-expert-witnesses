[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# Lead notification (Lead_notification_setup.md)
# Production: POST /api/submit-lead → Next.js app/api/submit-lead/route.ts
#   which writes Google Sheets (if configured) and POSTs to Lead_notification_url
#   with keys: Full Name | Email | Phone Number | Brand name
#
# Uncomment to force the Netlify function instead (webhook only; skips Sheets):
# [[redirects]]
#   from = "/api/submit-lead"
#   to = "/.netlify/functions/submit-lead"
#   status = 200
#   force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
